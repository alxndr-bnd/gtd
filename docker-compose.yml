services:
  gtd:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: [./data:/data]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [gtd]
volumes:
  caddy_data:
