<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#5f6a7a;--bd:#e3e7ee;--ac:#0F766E;--on-ac:#fff;--ok:#1f9d55;--warn:#d97706;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--tx:#e6eaf0;--mut:#8b96a6;--bd:#2a323e;--ac:#2BA597;--on-ac:#0b1a18;--ok:#3ec97b;--warn:#f0a03c;--bad:#f07070}}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px} input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}  /* фокус — в цвет логотипа, а не синий браузерный */
*{accent-color:var(--ac)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:230px;padding:16px 10px;border-right:1px solid var(--bd);background:var(--card);flex-shrink:0}
nav h1{font-size:17px;margin:0 8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px} nav h1 img,.login h1 img{display:block} nav h1:hover{color:var(--ac)}
button.icon{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
/* Подпись кнопки захвата (SERBITO-354, G12): на широком экране — значок и слово, на телефоне — только значок;
   aria-label начинается с этого слова */
.cap .lbl{font-weight:600} @media(max-width:700px){.cap .lbl{display:none}} .hero button.icon svg{width:26px;height:26px}
nav a{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--bg)} nav a.on{background:var(--ac);color:var(--on-ac)}
nav a .n{opacity:.7;font-size:13px;font-variant-numeric:tabular-nums}  /* по базовой линии названия, а не по верху */
nav .sep{height:1px;background:var(--bd);margin:10px 4px}
main{flex:1;max-width:820px;margin:0 auto;padding:20px 16px 80px;width:100%}
h2{margin:0 0 12px;font-size:20px}
.cap{display:flex;gap:8px;margin-bottom:16px;align-items:center}  /* кнопка — по центру высоты поля */
.cap textarea{flex:1;padding:12px 14px;white-space:pre-wrap;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);
  font:inherit;font-size:15px;line-height:22px;resize:none;overflow:hidden;display:block}
.cap button{height:48px;flex-shrink:0}  /* высота однострочного поля: 12+22+12+2 */
.cap input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px}
button,select{font:inherit}
button{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
button.sm{padding:3px 8px;font-size:12.5px;color:var(--mut)}
button.sm:hover{color:var(--tx)}
.hint{color:var(--mut);font-size:13px;margin:-8px 0 14px}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.it .ck{display:flex;flex-shrink:0;cursor:pointer} .it input[type=checkbox]{margin:4px 0 0;width:17px;height:17px}
.it .b{flex:1;min-width:0}
.it .num{color:var(--mut);font-size:12.5px;text-decoration:none;margin-top:2px;flex-shrink:0;font-variant-numeric:tabular-nums}
.it .num:hover{color:var(--ac)}
.it .t{word-break:break-word} .it.done .t{text-decoration:line-through;color:var(--mut)}
/* Вся карточка задачи открывает её (SERBITO-299) */
.it[data-id]{cursor:pointer;transition:border-color .12s}
@media(hover:hover){.it[data-id]:hover{border-color:var(--mut)}}
.meta{color:var(--mut);font-size:12.5px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.meta .due{color:var(--warn)} .meta .due.over{color:var(--bad);font-weight:600}
.act{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:3px 10px;border:1px solid var(--bd);border-radius:99px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.empty .ex{margin-top:6px;font-size:13px}
/* Чек-лист первого запуска — карточка над Inbox; с ней поле захвата не по центру экрана, а сразу под ней */
.onb{position:relative;margin:4px 0 0} .onb h3{margin:0 0 8px;padding-right:32px}
.onb .onbx{position:absolute;top:6px;right:6px;border:0;background:none;font-size:14px}
.onbi{padding:3px 0} .onbi span{color:var(--mut);font-size:13px} .onbi.ok b{text-decoration:line-through;color:var(--mut)}
.pj{cursor:pointer} .pj .warn{color:var(--warn)}
.it.done{background:none}
/* Перетаскивание (SERBITO-328): поднятая карточка — с тенью поверх соседей */
.dnd > .it.dragging{position:relative;z-index:5;box-shadow:0 10px 28px #0003;border-color:var(--ac);cursor:grabbing;transition:none}
body.dnd-on,body.dnd-on *{-webkit-user-select:none;user-select:none;cursor:grabbing}
@media(pointer:coarse){.dnd > .it{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
/* Ручка ⠿ (SERBITO-354): на сенсорном экране тянуть за неё можно сразу, без удержания; мышью тянется вся карточка */
.it .grip{display:none}
@media(pointer:coarse){.dnd > .it .grip{display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;
  margin:-10px -12px -10px -4px;align-self:stretch;color:var(--mut);font-size:18px;touch-action:none;cursor:grab}}
.dndtip{display:flex;align-items:center;gap:8px;margin:0 0 10px} .dndtip span{flex:1}  /* выполненная — приглушённая: без фона карточки, заголовок зачёркнут */
.pjh select.dmode{font-size:12.5px;font-weight:400;color:var(--mut);padding:3px 6px;border:1px solid var(--bd);border-radius:8px;
  background:var(--card);vertical-align:middle;max-width:100%}
.fl{display:block;color:var(--mut);font-size:13px;margin:0 0 4px}
.pjpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px} .pjpick button{min-height:40px}
.donesec{margin-top:18px} .donesec summary{cursor:pointer;color:var(--mut);font-weight:600;padding:6px 0;margin-bottom:6px}
.rv{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rv h3{margin:0 0 6px;font-size:15px} .rv h4{margin:12px 0 4px;font-size:14px} .rv a{color:var(--ac);cursor:pointer}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(480px,94vw);padding:18px}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:10px 0 3px;color:var(--mut);font-size:13px}
dialog input,dialog select,dialog textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.login{max-width:420px;margin:12vh auto;text-align:center;padding:0 16px}
.login .cap{margin:0}
.gbtn{display:flex;min-height:44px} .login .gbtn{justify-content:center}
/* Кнопки входа (SERBITO-354, G11): все во всю ширину блока, «Войти по коду» и Telegram — один заметный вид */
#signin .tgfb,.login .tgfb{width:100%;min-height:44px}
#signin .cap button:not(.pri),#signin .tgfb,.login .cap button:not(.pri),.login .tgfb{border-color:var(--ac);color:var(--ac);font-weight:600}
.or{color:var(--mut);font-size:13px;margin:14px 0;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
.msg{color:var(--warn);font-size:13px;margin-top:10px;min-height:1em} #npmsg{margin:-10px 0 12px} .msg .rv{color:var(--tx);font-size:14px}
.rv .cap{margin:8px 0 0}
/* MCP-токены в «Аккаунте» (SERBITO-375): длинные токен и команда переносятся, а не растягивают страницу */
.tokrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0} .tokrow code,.newtok code{word-break:break-all;font-size:12.5px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px}
.newtok{border:1px solid var(--ac);border-radius:8px;padding:10px 12px;margin:8px 0}
.tok{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)} .tok small{color:var(--mut)}
.capw{position:relative;flex:1;display:flex} .capw input,.capw textarea{width:100%}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px #0003;z-index:10;overflow:hidden}
/* Сверху — небольшой отступ, как под чек-листом: исчез чек-лист — поле не съезжает вниз (SERBITO-354, G8).
   По центру экрана — только совсем пустой Inbox (.solo) */
.hero{padding-top:32px;text-align:center}
.hero.solo{padding-top:calc(50vh - 100px)}  /* поле в центре экрана; верх зафиксирован — растёт только вниз */
.hero h2{font-size:24px;margin-bottom:14px}
.hero .cap{margin-bottom:10px}
.hero .cap textarea{padding:16px 18px;font-size:17px;line-height:24px;border-radius:14px}
.hero .cap button{padding:0 22px;border-radius:14px;height:58px}  /* 16+24+16+2 */
.hero .hint{margin:0 0 24px}
.ac{text-align:left}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums} .tile span{color:var(--mut);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}
.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
[hidden]{display:none !important}  /* hidden сильнее любого display из классов (.toast{display:flex} и т.п.) */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
  width:min(560px,calc(100vw - 24px));background:#1f2733;color:#fff;border-radius:12px;padding:12px 14px 14px;box-shadow:0 8px 30px #0005;overflow:hidden}
.toast .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{background:none;border:1px solid #fff6;color:#fff;font-weight:600;min-height:40px;padding:0 14px}
.toast .cxs{display:flex;gap:6px;flex-shrink:0} .toast button.cx{font-weight:400;padding:0 10px;border-radius:99px}
.toast .sec{font-variant-numeric:tabular-nums;opacity:.7;min-width:2ch;text-align:right}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--ac);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.seg{display:flex;gap:6px;margin-top:8px} .seg button{min-width:56px} .seg button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
/* Телефон: кнопки на карточке — сеткой под палец (≥44px), корзина отдельно справа */
@media(max-width:700px){
  .it .act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .it .act.has-del{grid-template-columns:1fr 1fr 52px}
  .it .act button.sm{min-height:44px;font-size:15px;color:var(--tx);padding:0 6px;white-space:nowrap}
  .it .act .ar{display:none}  /* на узкой кнопке «→» лишняя — слово влезает целиком */
  .it .act button.del{grid-column:3;grid-row:1 / span 3}  /* во Inbox — три ряда: Next, Project, Waiting, Someday, Ref */
  .it input[type=checkbox]{width:24px;height:24px;margin:0}
  /* Зоны тапа ≥44px (SERBITO-354, G7): галочка — во всю высоту от левого края карточки, «#N» — квадрат 44 */
  .it .ck{min-width:44px;min-height:44px;margin:-10px -6px -10px -12px;align-items:center;justify-content:center}
  .it .num{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin:-10px -6px -10px 0}
  .toast{bottom:12px;flex-wrap:wrap;row-gap:8px}
  .toast .cxs{order:5;flex-basis:100%}  /* @контексты — отдельной строкой: текст «… → Next» не обрезается */
}
.it.sel,.it:focus-visible{outline:2px solid var(--ac);outline-offset:-1px}
nav a.kb{outline:2px solid var(--ac);outline-offset:2px}  /* снаружи с зазором — видна и на синем активном */
.draftnote{color:var(--warn);font-size:12.5px;margin-top:10px} .draftnote a{color:inherit}
nav .keys{color:var(--mut);font-size:11.5px;line-height:1.6;margin:18px 10px 0}
nav a.ccl{color:var(--mut);font-size:13px}
nav small.ver{color:var(--mut);margin-left:4px} nav .newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:6px;vertical-align:middle}  /* «Настройки cookie»: снова открывает баннер согласия (SERBITO-319, pages.CONSENT) */
@media(max-width:700px){nav .keys{display:none}}
.below{margin-top:56px} .below h3{font-size:17px;margin:0 0 4px} .below .hint{margin:0 0 12px}
.dnd + .below,.below + .below{margin-top:32px}  /* под задачами Inbox — ближе: это продолжение того же экрана */
.hero .inbox-empty{font-weight:600;margin:0 0 4px}
@media(max-width:700px){.hero.solo{padding-top:calc(50vh - 150px)}}
.aco{padding:8px 14px;cursor:pointer} .aco.on{background:var(--ac);color:var(--on-ac)}
.aco small{opacity:.7;margin-left:6px}
/* Аккаунт: одна кнопка, раскрывает «Аккаунт» и «Выйти» */
.userbox{position:relative}
button.user{width:100%;display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--tx)}
button.user:hover{background:var(--bg)} button.user span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.umenu a,.umenu button{display:block;width:100%;padding:8px 10px 8px 28px;border:0;border-radius:8px;background:none;color:var(--tx);
  font:inherit;text-align:left;text-decoration:none;cursor:pointer}  /* «Выйти» — кнопка (Enter и пробел), выглядит как пункт */
.umenu a:hover,.umenu button:hover{background:var(--bg)}
.topbar,.scrim{display:none}
/* Телефон: сверху ☰ · раздел · 👤, разделы — в выезжающем слева меню */
@media(max-width:700px){
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:6px 10px}
  .burger{border:0;background:none;padding:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
  .tb-title{flex:1;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .userbox{flex-shrink:0;max-width:45%} .topbar button.user{padding:0 8px;height:36px;line-height:1}
  .topbar .umenu{position:absolute;right:0;top:100%;margin-top:6px;min-width:180px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px #0003;padding:4px}
  .topbar .umenu a,.topbar .umenu button{padding-left:10px}
  /* Закрытое меню — visibility:hidden: его пункты не ловят Tab за краем экрана (SERBITO-349); прячется после выезда */
  nav{position:fixed;top:0;left:0;bottom:0;width:min(280px,82vw);z-index:40;overflow-y:auto;transform:translateX(-105%);
    visibility:hidden;transition:transform .2s,visibility 0s .2s;border-right:1px solid var(--bd)}
  nav.open{transform:none;box-shadow:0 0 40px #0005;visibility:visible;transition:transform .2s}
  nav .navfoot{display:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:30;background:#0006}
}
</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ── Язык интерфейса (SERBITO-259). t('ключ', {подстановки}) — строка из словаря #i18n на текущем языке.
// Выбор: явная настройка в «Аккаунте» (me.lang) > вход на /en/ (браузер это запоминает) > язык браузера.
// Язык браузера определяет сервер (/api/config → lang) по его Accept-Language — тем же правилом pages.lang_of,
// что и для бота: русский — ru, uk, be, сербский кириллицей; английский — все остальные
const I18N = JSON.parse($('#i18n').textContent);
const LANG_NAMES = {ru:'Русский', en:'English'};  // название языка пишется на нём самом — поэтому не в словаре
const VIEW_KEYS = ['inbox','next','waiting','scheduled','projects','someday','reference','done','review'];
// VIEWS, HELP, EMPTY (пустой раздел: что сюда попадает + пример), ONB (чек-лист первого запуска:
// [поле из /api/counts → onboarding, пункт, пояснение]), CAP_HINTS — части словаря текущего языка
let LANG, L, VIEWS, HELP, EMPTY, ONB, CAP_HINTS;
const t = (k, v = {}) => String(k.split('.').reduce((o, p) => o?.[p], L) ?? k).replace(/\{(\w+)\}/g, (m, n) => n in v ? v[n] : m);
function setLang(l){
  LANG = I18N[l] ? l : 'ru'; L = I18N[LANG]; document.documentElement.lang = LANG;
  VIEWS = VIEW_KEYS.map(k => [k, L.views[k]]);
  ({help:HELP, empty:EMPTY, onb:ONB, cap_hints:CAP_HINTS} = L);
}
const pathEn = () => /^\/en(\/|$)/.test(location.pathname);
// Вошёл на /en/ — приложение и дальше английское в этом браузере, пока язык не выбран в «Аккаунте»
const langHint = {
  get(){ try{ return localStorage.getItem('gtd-lang'); }catch{ return null; } },
  set(v){ try{ localStorage.setItem('gtd-lang', v); }catch{} },
  del(){ try{ localStorage.removeItem('gtd-lang'); }catch{} },
};
const autoLang = () => pathEn() || langHint.get()==='en' ? 'en' : (S.cfg.lang || 'ru');
function applyLang(){  // после /api/me: вошли на /en/ — запоминаем; на русской странице входа — забываем
  if(pathEn()) langHint.set('en'); else if(S.fromLogin) langHint.del();
  S.fromLogin = false;
  setLang(S.me?.lang || autoLang());
}
// До /api/config — язык страницы от сервера (/en/ — en, иначе ru): им говорит лендинг гостю
setLang(document.documentElement.lang);
let S = {view:'inbox', items:[], projects:[], contexts:[], counts:{}, ctx:null, pid:null, cfg:{}};

// ── Адреса разделов (SERBITO-354): /next, /projects, /p/<id>… (на /en/ — /en/next). Переход — запись в истории
// браузера, и Back (кнопка, жест на телефоне) возвращает в прошлый раздел, а не уводит с сайта. Inbox — это /.
// Карточка задачи — /i/<номер>: открыли из списка — своя запись, Back её закрывает. Список — app.APP_VIEWS
const ROUTE_VIEWS = ['next','waiting','scheduled','projects','someday','reference','done','review','account','stats'];
function routeOf(path = location.pathname){
  const p = path.replace(/^\/en(?=\/|$)/, '') || '/';
  let m;
  if((m = p.match(/^\/i\/(\d+)$/))) return {card:+m[1]};
  if((m = p.match(/^\/p\/(\d+)$/))) return {view:'projects', pid:+m[1]};
  const v = p.slice(1);
  return {view:ROUTE_VIEWS.includes(v) ? v : 'inbox', pid:null};
}
// S.en — разделы под /en/: вошли на /en/… и язык не выбран явно в «Аккаунте»
function viewPath(view = S.view, pid = S.pid){
  const p = view==='projects' && pid ? `/p/${pid}` : view==='inbox' ? '/' : '/'+view;
  return S.en ? (p==='/' ? '/en/' : '/en'+p) : p;
}
function routeApply(r){ S.view = r.view || 'inbox'; S.pid = r.pid || null; S.ctx = null; S.sel = null; }
// Перейти в раздел (проект): новая запись в истории, если адрес другой
function go(view, pid = null){
  routeApply({view, pid});
  const path = viewPath();
  if(location.pathname !== path) history.pushState(null, '', path);
  return load();
}
S.en = pathEn();
routeApply(routeOf());
// Back / Forward: карточка /i/N — открыть её; иначе закрыть открытый диалог и показать раздел из адреса
addEventListener('popstate', () => {
  const r = routeOf(), d = $('#dlg');
  if(r.card) return openByNum(r.card);
  if(d.open) d.close();
  if(r.view !== S.view || (r.pid || null) !== S.pid){ routeApply(r); load(); }
});

// Accept-Language — выбранный язык интерфейса: на нём сервер пишет ошибки и письма
const hdrs = json => ({'Accept-Language': LANG, ...(json ? {'Content-Type':'application/json'} : {})});
async function api(path, method='GET', body){
  const r = await fetch('/api'+path, {method, headers:hdrs(body), body:body?JSON.stringify(body):undefined});
  if(r.status===401) throw new Error('auth');
  return r.json();
}
// «25.09, 14:00» / «25 Sept, 14:00»: по-английски месяц словом — 09/25 и 25/09 не перепутать
const fmtTs = ts => ts ? new Date(ts*1000).toLocaleString(LANG==='en' ? 'en-GB' : 'ru-RU',
  {day:LANG==='en' ? 'numeric' : '2-digit', month:LANG==='en' ? 'short' : '2-digit', hour:'2-digit', minute:'2-digit'}) : '';
const toLocalInput = ts => { if(!ts) return ''; const d=new Date(ts*1000); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

async function load(){
  try{
    if(!S.cfgLoaded){
      S.cfg = await fetch('/api/config').then(r=>r.json()); S.cfgLoaded = true;
      devLiveReload();
      if(!S.cfg.user) return loginScreen();
    }
    S.counts = await api('/counts');
    const resume = oauthResume(); if(resume) return location.replace(resume);  // вошли ради подключения приложения
    onbTrack(S.counts.onboarding);
    if(!S.me){ S.me = await api('/me'); applyLang(); }  // имя для кнопки аккаунта и язык интерфейса
    S.projects = await api('/projects');
    S.contexts = await api('/contexts');
    if(S.pid && !S.projects.some(p => p.id===S.pid)){  // чужой, удалённый или завершённый проект — список проектов
      S.pid = null; if(!location.pathname.startsWith('/i/')) history.replaceState(null, '', viewPath());
    }
    if(S.view!=='account') S.newToken = null;  // показанный токен не переживает уход из «Аккаунта»
    if(S.view==='account'){ S.me = await api('/me'); [S.tokens, S.apps] = await Promise.all([api('/tokens'), api('/oauth/apps')]); }
    else if(S.view==='stats') S.stats = await api('/admin/stats');
    else if(S.view==='projects' && !S.pid) S.items=[];
    else if(S.view==='projects'){  // выполненные сервер отдаёт, только если проект их показывает (SERBITO-327)
      const pj = S.projects.find(p=>p.id===S.pid);
      S.items = await api(`/items?status=all&project_id=${S.pid}${pj && doneMode(pj)!=='hide' ? '&done=1' : ''}`);
    }
    else if(S.view!=='review') S.items = await api('/items?status='+S.view);
    else S.items = await api('/items?status=all');
    // Экран Inbox — что делать дальше (SERBITO-326): под входящими «Скоро срок» и Next
    [S.dueItems, S.nextItems] = S.view==='inbox'
      ? await Promise.all([api('/items?status=due'), api('/items?status=next')]) : [[], []];
    render();
    await openDeepLink();
  }catch(e){ if(e.message==='auth') return loginScreen(); console.error(e); }
}

// Вход ради подключения AI-приложения (SERBITO-375, OAuth): гостю страница /authorize запомнила свой адрес
// в sessionStorage (oauth.RESUME_KEY) и отправила на вход. Вошёл — возвращаем на экран согласия. Только свой
// /authorize и только полчаса: ссылка из хранилища не уведёт ни на чужой сайт, ни в давно брошенный вход
function oauthResume(){
  try{
    const v = JSON.parse(sessionStorage.getItem('gtd-oauth-next') || 'null');
    sessionStorage.removeItem('gtd-oauth-next');
    if(v && typeof v.u==='string' && v.u.startsWith('/authorize?') && Date.now() - v.t < 30*60e3) return v.u;
  }catch{}
  return '';
}

// Пришли по ссылке /i/N: после входа открываем карточку. Чужой или удалённой задачи просто нет.
async function openDeepLink(){

  S.deepDone = true;
  return openByNum(+m[1]);
}
async function openByNum(n){
  const it = await api('/items/n/'+n);

// Локально (DEV=1): страница сама обновляется, когда сервер перезапустился после правки .py
// или поменялся static/. Набранный текст переживает обновление — он в черновиках.
function devLiveReload(){
  if(!S.cfg.dev || S.devWatch) return;
  S.devWatch = true;
  let v = null;
  setInterval(async () => {
    try{
      const r = await fetch('/api/dev/version'); if(!r.ok) return;

        return location.reload();
      }
      v = d.v;
    }catch{}  // сервер перезапускается — подождём следующей попытки
  }, 1000);
}

  S.cfg = await fetch('/api/config').then(r=>r.json()); S.cfgLoaded = true;
  routeApply(routeOf()); S.onb = null; S.me = null; S.fromLogin = true;  // следующий вход может быть в другой аккаунт;

  const buttons = `${parts.join(`<div class="or">${t('or')}</div>`) || `<p>${t('no_methods')}</p>`}
    <div class="msg" id="authmsg"></div>
    ${c.dev?'<p><a href="/dev-login"><button>Dev login</button></a></p>':''}`;
  // Гостю сервер отдал лендинг (текст — в HTML для поисковиков): кнопки встают в его блок входа
  if($('#signin')){ $('#signin').innerHTML = buttons; lazyWidgets($('#signin')); }
  else { document.title = 'GTD'; $('#root').innerHTML = `<div class="login"><h1 style="display:flex;align-items:center;gap:10px"><img src="/favicon.svg" alt="" width="32" height="32">GTD</h1><p class="hint" style="margin:0 0 20px">${t('login_hint')}</p>

// Виджеты входа Google и Telegram — ~300 КБ чужих скриптов и шрифтов (SERBITO-349, решение владельца). На лендинге
// они не грузятся вместе со страницей: только когда блок входа на экране (после load и в простое — не спорят
// с первой отрисовкой) или человек сам потянулся к нему (навёл, нажал, Tab в поле). Высота блока зарезервирована
// (#signin min-height), поэтому ничего не сдвигается. Без IntersectionObserver — просто после load в простое
function lazyWidgets(box){
  S.lazyOff?.();  // повторный loginScreen — прежнее ожидание больше не нужно
  const card = box.closest('.signin') || box, evs = ['pointerover', 'pointerdown', 'focusin'];
  let io = null, done = false;
  const off = S.lazyOff = () => { done = true; io?.disconnect(); evs.forEach(ev => card.removeEventListener(ev, go)); };
  function go(){ if(done) return; off(); if(box.isConnected){ mountGoogle(); mountTelegram(); } }
  const idle = () => window.requestIdleCallback ? requestIdleCallback(go, {timeout: 1500}) : setTimeout(go, 200);
  const later = () => document.readyState === 'complete' ? idle() : addEventListener('load', idle, {once: true});
  // Будет виджет Telegram — запасную кнопку прячем сразу, как это делает mountTelegram: место ждёт виджет
  if(S.cfg.bot && tgWidgetOk() && $('.tgfb')) $('.tgfb').hidden = true;
  evs.forEach(ev => card.addEventListener(ev, go));
  if(!window.IntersectionObserver) return later();
  io = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)){ io.disconnect(); later(); } });
  io.observe(box);
}

// ── Вход и привязка: одни и те же кнопки; на экране приложения (есть .app) они привязывают способ к аккаунту
const linking = () => !!$('.app');
const authMsg = msg => { const el = $('#authmsg'); if(el) el.textContent = msg; };
async function authPost(path, body){
  const r = await fetch('/api/auth/'+path, {method:'POST', headers:hdrs(true), body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(d.detail || t('error')), {data:d});
  return d;
}
// Способ входа уже у другого аккаунта с задачами — сервер предлагает объединить аккаунты
function authFail(err){ if(err.data?.merge) mergeOffer(err.data); else authMsg(err.message); }
function mergeOffer(d){
  const el = $('#authmsg'); if(!el) return;
  el.innerHTML = `<div class="rv" style="text-align:left">${esc(d.detail)}
    <div class="row" style="justify-content:flex-start"><button class="pri" data-act="merge" data-token="${esc(d.merge)}">${t('merge_yes')}</button>

async function mergeApply(token){

const emailFormHtml = label => `<div class="cap"><input id="em" type="email" autocomplete="email" placeholder="${t('email_ph')}">

function mountGoogle(){
  const el = $('.gbtn'); if(!el || !S.cfg.google) return;

      try{ const lk = linking(); await authPost('google', {credential, link:lk}); ga(lk ? 'link_method' : 'login', {method:'google'}); load(); }catch(err){ authFail(err); }
    }});

    google.accounts.id.renderButton(el, {theme:'outline', size:'large', text:linking()?'continue_with':'signin_with', locale:LANG,
      width:Math.min(400, Math.max(200, el.clientWidth))});
  };
  if(window.google?.accounts) return go();
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = go;
  document.head.appendChild(s);
}

async function emailSend(){

// ── Telegram (SERBITO-292): на проде с компьютера — официальный Login Widget, вход в один клик.
// Запасной путь — ссылка в бота (Start → «Подтвердить» → страница ждёт): виджет работает только на домене,
// заданном в BotFather (локально и на *.run.app — нет), а на телефоне и во встроенных браузерах он хуже ссылки:
// открывает oauth.telegram.org во всплывающем окне и просит номер телефона вместо того, чтобы открыть приложение.
const TG_WIDGET_WAIT = 5000;  // мс: столько ждём iframe виджета, потом показываем запасную кнопку
const tgWidgetOk = () => location.hostname === 'gtd.serbito.rs' && !matchMedia('(pointer: coarse)').matches;
const tgHtml = label => `<div class="tgw"></div><button data-act="tglogin" class="tgfb">${label}</button>
  <div id="tgst" class="hint" style="margin:10px 0 0"></div>`;

function mountTelegram(){
  const box = $('.tgw'), fb = $('.tgfb'); if(!box || !S.cfg.bot || !tgWidgetOk()) return;
  fb.hidden = true;
  const fallback = () => { clearTimeout(timer); box.remove(); fb.hidden = false; };
  window.onTelegramAuth = tgWidgetAuth;
  const s = document.createElement('script');  // виджет встаёт iframe'ом на место своего <script>
  s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22'; s.onerror = fallback;
  Object.assign(s.dataset, {telegramLogin:S.cfg.bot, size:'large', userpic:'false', lang:LANG,
    requestAccess:'write', onauth:'onTelegramAuth(user)'});  // write — бот сможет писать напоминания без Start
  box.appendChild(s);
  const timer = setTimeout(() => { if(!box.querySelector('iframe')) fallback(); }, TG_WIDGET_WAIT);
}

async function tgWidgetAuth(user){
  try{ const lk = linking(); await authPost('tg/widget', {auth:user, link:lk}); ga(lk ? 'link_method' : 'login', {method:'telegram'}); load(); }
  catch(err){ authFail(err); }
}

async function tgStart(){
  try{
    const d = await authPost('tg/start', {link:linking()});
    // Число сверки (SERBITO-360): в боте из трёх кнопок верна та, что показана здесь
    $('#tgst').innerHTML = `<p>${t('tg_code')} <b class="tgcode" style="font-size:22px;letter-spacing:2px">${esc(d.code)}</b></p>
      <p><a href="${esc(d.url)}" target="_blank" rel="noopener"><button class="pri">${t('open_tg')}</button></a></p>
      ${t('tg_hint')}`;
    tgPoll(d.nonce);
  }catch(err){ authMsg(err.message); }
}

async function tgPoll(nonce){
  clearTimeout(S.tgTimer);
  // POST, nonce в теле: в журналы запросов он не попадает
  const r = await fetch('/api/auth/tg/poll', {method:'POST', headers:hdrs(true), body:JSON.stringify({nonce})})
    .then(r=>r.json()).catch(()=>({status:'pending'}));
  if(r.status==='ok'){ ga(linking() ? 'link_method' : 'login', {method:'telegram'}); return load(); }
  if(r.status==='merge') return mergeOffer(r);
  if(r.status==='expired') return authMsg(t('tg_expired'));
  if(r.status==='denied') return authMsg(t('tg_denied'));
  S.tgTimer = setTimeout(()=>tgPoll(nonce), 2000);
}

// MCP (SERBITO-375): адрес сервера и личные токены. Новый токен виден, только пока открыт «Аккаунт» (S.newToken
// живёт в памяти страницы и нигде не сохраняется) — сервер хранит лишь его хеш
const MCP_DOCS = 'https://github.com/alxndr-bnd/gtd#connect-claude-mcp';
const mcpUrl = () => location.origin + '/mcp';
const mcpCmd = tok => `claude mcp add --transport http gtd ${mcpUrl()} --header "Authorization: Bearer ${tok}"`;
function mcpHtml(){
  const nt = S.newToken;
  const copyRow = (v, what) => `<div class="tokrow"><code>${esc(v)}</code><button class="sm" data-act="copytok" data-v="${what}">${t('copy')}</button></div>`;
  return `<div class="rv" id="mcp"><h3>${t('mcp')}</h3>${t('mcp_text')}

    <p>${t('mcp_connector')}</p>
    <h4>${t('apps')}</h4>
    ${(S.apps||[]).map(a => `<div class="tok app"><span><b>${esc(a.name)}</b><br><small>${t('app_meta',
      {host:esc(a.host), created:fmtTs(a.created), used:a.last_used ? fmtTs(a.last_used) : t('token_never')})}</small></span>
      <button class="sm del" data-act="disconnectapp" data-id="${a.id}">${t('app_disconnect')}</button></div>`).join('')
      || `<div class="tokrow">${t('apps_none')}</div>`}
    <p>${t('mcp_token_text')}</p>
    ${nt ? `<div class="newtok"><b>${t('token_once')}</b>${copyRow(nt.token, 'token')}
      <div>${t('token_cmd')}</div>${copyRow(mcpCmd(nt.token), 'cmd')}
      <button class="sm" data-act="tokhide">${t('token_hide')}</button></div>` : ''}
    ${(S.tokens||[]).map(k => `<div class="tok"><span><b>${esc(k.name)}</b><br><small>${t('token_meta',
      {created:fmtTs(k.created), used:k.last_used ? fmtTs(k.last_used) : t('token_never')})}</small></span>
      <button class="sm del" data-act="revoketok" data-id="${k.id}">${t('token_revoke')}</button></div>`).join('')
      || `<div class="tokrow">${t('tokens_none')}</div>`}
    <div class="cap"><input id="tokname" maxlength="60" autocomplete="off" placeholder="${t('token_name_ph')}"><button data-act="newtok">${t('token_create')}</button></div>
    <div class="msg" id="tokmsg"></div><div class="hint" style="margin:4px 0 0">${t('mcp_note')}</div></div>`;
}
async function createToken(){
  const inp = $('#tokname'), name = inp.value.trim();
  if(!name){ $('#tokmsg').textContent = t('token_name_needed'); return inp.focus(); }
  const r = await api('/tokens', 'POST', {name});
  if(!r.token){ $('#tokmsg').textContent = r.detail || t('error'); return inp.focus(); }
  S.newToken = r; S.tokens = await api('/tokens'); render();
}
async function copyToken(btn){
  const nt = S.newToken; if(!nt) return;
  try{ await navigator.clipboard.writeText(btn.dataset.v==='cmd' ? mcpCmd(nt.token) : nt.token); btn.textContent = t('copied'); }
  catch{ btn.textContent = t('error'); }
  setTimeout(() => btn.textContent = t('copy'), 1500);
}
async function disconnectApp(id){
  const a = (S.apps||[]).find(x => x.id===id);
  if(!a || !confirm(t('app_disconnect_q', {name:a.name}))) return;
  await api('/oauth/apps/'+id, 'DELETE'); S.apps = await api('/oauth/apps'); render();
}
async function revokeToken(id){
  const k = (S.tokens||[]).find(x => x.id===id);
  if(!k || !confirm(t('token_revoke_q', {name:k.name}))) return;
  await api('/tokens/'+id, 'DELETE'); S.tokens = await api('/tokens'); render();
}

// Статистика использования — только агрегаты (сервер не отдаёт ни задач, ни почт, ни имён)
function statsHtml(){
  const st = S.stats; if(!st || !st.users) return `<h2>${t('stats')}</h2><div class="empty">${t('no_access')}</div>`;
  const tile = (n, l) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`;
  const max = Math.max(1, ...st.daily.map(d => d.users));
  return `<h2>${t('stats')}</h2><div class="hint">${t('stats_hint')}</div>
  <div class="tiles">${tile(st.users.total,t('st_users'))}${tile(st.active.day,t('st_today'))}
    ${tile(st.active.week,t('st_7d'))}${tile(st.active.month,t('st_30d'))}</div>
  <div class="rv"><h3>${t('st_daily')}</h3><div class="bars">${st.daily.map(d =>
    `<i style="height:${Math.round(d.users / max * 100)}%" title="${t('st_bar', d)}"></i>`).join('')}</div></div>
  <div class="tiles">${tile(st.users.new_7d,t('st_new7'))}${tile(st.users.new_30d,t('st_new30'))}
    ${tile(st.tasks.created_7d,t('st_tasks7'))}${tile(st.tasks.created_30d,t('st_tasks30'))}</div>
  <div class="rv"><h3>${t('st_channels')}</h3>${t('st_channels_text', {web:st.active.web_30d, tg:st.active.telegram_30d})}
    <h3 style="margin-top:12px">${t('st_methods')}</h3>${t('st_methods_text', {email:st.users.with_email, google:st.users.with_google, tg:st.users.with_telegram})}</div>`;
}

// сюда не попадает никогда, и на /i/N тоже: заголовок остаётся в истории браузера и на скриншотах

// «Что нового» и работающая версия (SERBITO-329, pages.VERSION_LABEL через /api/config). Точка — пока
// текущую версию не видели на /changes (она сама пишет gtd-seen-version). Ничего не записано — первое знакомство:
// запоминаем молча, точки нет. localStorage недоступен — тоже без точки
function changesLink(){
  const v = (S.cfg||{}).version; if(!v) return '';
  let fresh = false;
  try{ const seen = localStorage.getItem('gtd-seen-version');
    if(seen === null) localStorage.setItem('gtd-seen-version', v); else fresh = seen !== v; }catch{}
  return `<a class="changes" href="${t('changes_url')}">${t('changes')}<small class="ver">${esc(v)}</small>`
    + `${fresh ? `<span class="newdot" role="img" aria-label="${t('changes_new')}" title="${t('changes_new')}"></span>` : ''}</a>`;
}

// Срок прошёл, а задача не закрыта — красным и словом «просрочено» (не только цветом)
const overdue = it => it.remind_at && it.remind_at < Date.now()/1000 && !['done','trash'].includes(it.status);
const dueHtml = it => overdue(it) ? `<span class="due over">⏰ ${fmtTs(it.remind_at)} · ${t('overdue')}</span>`
  : `<span class="due">⏰ ${fmtTs(it.remind_at)}</span>`;
function itemHtml(it){
  const acts = [];
  // «→ Project» (SERBITO-354) — не список, а выбор проекта: своя кнопка (data-act=toproj), задача уходит в Next проекта
  if(it.status==='inbox') acts.push(['next','→ Next'],['project',t('to_project')],['waiting','→ Waiting'],['someday','→ Someday'],['reference','→ Ref'],['trash','🗑']);
  else if(it.status==='next') acts.push(['waiting','→ Waiting'],['someday','→ Someday']);
  else if(it.status==='waiting') acts.push(['next','→ Next']);
  else if(it.status==='someday') acts.push(['next','→ Next']);
  else if(it.status==='done') acts.push(['next',t('restore')]);
  // tabindex=-1: карточку фокусирует выбор стрелками и возврат из диалога, в порядок Tab она не входит
  return `<div class="it ${it.status==='done'?'done':''}" data-id="${it.id}" tabindex="-1">
    <label class="ck"><input type="checkbox" data-act="toggle" aria-label="${esc(it.title)}" ${it.status==='done'?'checked':''}></label>
    <div class="b"><div class="t" data-act="edit">${esc(it.title)}</div>
      <div class="meta">${it.remind_at?dueHtml(it):''}${it.context?`<span>@${esc(it.context)}</span>`:''}${it.project?`<span>#${esc(it.project)}</span>`:''}${it.source==='telegram'?'<span>✈️</span>':''}${it.notes?'<span>📝</span>':''}</div>
      ${acts.length?`<div class="act ${acts.some(a=>a[0]==='trash')?'has-del':''}">${acts.map(([s,l])=>`<button class="sm ${s==='trash'?'del':''}" ${s==='project'?'data-act="toproj"':`data-act="mv" data-st="${s}"`} ${s==='trash'?`aria-label="${t('to_trash')}"`:''}>${l.replace(/^→ /, '<span class="ar">→ </span>')}</button>`).join('')}</div>`:''}
    </div>${it.num?`<a class="num" href="/i/${it.num}" data-act="edit" title="${t('task_n', {n:it.num})}">#${it.num}</a>`:''}<span class="grip" aria-hidden="true">⠿</span></div>`;
}

// Стрелка, входящая в лоток: «положить во входящие»
const ICON_INBOX = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/>
  <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M4 14h4l1.5 2h5l1.5-2h4"/></svg>`;
// Поле захвата — textarea в одну строку: длинный текст переносится, и поле растёт вниз (capFit)
// Подсказка — самая длинная из вариантов CAP_HINTS, что целиком влезает в текущую ширину поля (capHint)
function capHint(el = $('#cap')){
  if(!el || !el.clientWidth || el.dataset.pid) return;  // в проекте подсказка своя — «Добавить задачу в #…»
  const cs = getComputedStyle(el), ctx = (capHint.ctx ||= document.createElement('canvas').getContext('2d'));
  ctx.font = `${cs.fontSize} ${cs.fontFamily}`;
  const room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  el.placeholder = CAP_HINTS.find(h => ctx.measureText(h).width <= room) || CAP_HINTS.at(-1);
}
// pj — страница проекта (SERBITO-354): поле добавляет задачу в этот проект, подсказка и кнопка говорят об этом
const capHtml = (pj = null) => {
  const add = pj ? t('cap_project', {p:esc(pj.title)}) : t('cap_add');
  return `<div class="cap"><div class="capw"><textarea id="cap" rows="1" autocomplete="off" placeholder="${pj ? add : CAP_HINTS[0]}"
    ${pj ? `data-pid="${pj.id}"` : ''} autofocus></textarea><div id="ac" class="ac" role="listbox" hidden></div></div>
  <button class="pri icon" data-act="capture" aria-label="${add}" title="${add}">${ICON_INBOX}<span class="lbl">${t('cap_btn')}</span></button></div>`;
};

function render(){
  if(DND.on){ DND.rerender = true; return; }  // идёт перетаскивание — перерисуем, когда карточку отпустят
  let body='', hero='', topCap = true;  // topCap — общее поле захвата над разделом
  const live = l => (l||[]).filter(i => !S.pendingDel.has(i.id));
  S.items = live(S.items); S.nextItems = live(S.nextItems); S.dueItems = live(S.dueItems);
  if(S.view==='review') body = reviewHtml();
  else if(S.view==='account') body = accountHtml();
  else if(S.view==='stats') body = statsHtml();
  else if(S.view==='projects' && !S.pid){ body = projectsHtml(); topCap = false; }
  else{
    let items = S.items;
    let chips='';
    if(S.view==='next'){
      const ctxs=[...new Set(items.map(i=>i.context).filter(Boolean))];
      if(ctxs.length) chips=`<div class="chips"><span class="chip ${!S.ctx?'on':''}" data-ctx="">${t('all')}</span>${ctxs.map(c=>`<span class="chip ${S.ctx===c?'on':''}" data-ctx="${esc(c)}">@${esc(c)}</span>`).join('')}</div>`;
      if(S.ctx) items=items.filter(i=>i.context===S.ctx);
    }
    const pj = S.pid ? S.projects.find(p=>p.id===S.pid) : null;
    if(S.view==='inbox'){
      // Inbox — точка входа: поле захвата по центру экрана, задачи под ним (пустой инбокс — ровно посередине).
      // Ниже — что делать дальше: «Скоро срок», затем Next. Каждая задача на экране один раз: входящие
      // со сроком остаются в своём списке, задача из «Скоро срок» не повторяется в Next
      const onb = onbHtml(), due = S.dueItems.filter(i => i.status!=='inbox'), dueIds = new Set(due.map(i => i.id));
      const next = S.nextItems.filter(i => !dueIds.has(i.id));
      const sec = (cls, title, hint, list, cards = list.map(itemHtml).join('')) => list.length
        ? `<section class="below ${cls}"><h3>${title}</h3><div class="hint">${hint}</div>${cards}</section>` : '';
      hero = `${onb}<section class="hero ${onb||items.length||due.length||next.length?'':'solo'}"><h2>${VIEWS[0][1]}</h2>${capHtml()}
        ${items.length?`<div class="hint">${HELP.inbox}</div>`
          :`<div class="inbox-empty">${t('inbox_empty')}</div><div class="hint">${EMPTY.inbox[0]}<br>${t('ex', {ex:EMPTY.inbox[1]})}</div>`}</section>`;
      body = dndHtml(items) + sec('due-soon', t('due_soon'), t('due_hint'), due)  // «Скоро срок» — по дате, не переставляется
        + sec('next-sec', VIEWS[1][1], HELP.next, next, dndHtml(next));
    } else if(pj){ body = projectHtml(pj, items); topCap = false; }  // поле захвата — своё, под заголовком проекта
    else body = `<h2>${VIEWS.find(v=>v[0]===S.view)[1]}</h2>${items.length?`<div class="hint">${HELP[S.view]||''}</div>`:''}
      ${chips}${(DND_VIEWS.includes(S.view) ? dndHtml(items) : items.map(itemHtml).join('')) || emptyHtml(S.view)}`;
  }
  $('#root').innerHTML = `<div class="app">${navHtml()}<main>${hero || (topCap ? capHtml() : '')}${body}</main></div>`;
  if(S.view==='account'){ mountGoogle(); mountTelegram(); }
  dndTip.draw();
  const cap = $('#cap'), saved = draft.get('cap'); if(cap && saved && !cap.value) cap.value = saved;  // черновик поля захвата
  capFit(cap); capHint(cap);
  docTitle();  // и длинный SEO-заголовок лендинга после входа сменится
  gaPage();
  if(S.sel!=null){ S.sel = Math.min(S.sel, cards().length-1); if(S.sel<0) S.sel = null; }  // выбор переживает перерисовку
  const lost = !document.activeElement || document.activeElement===document.body;  // старый список заменён
  if(S.sel!=null || S.zone==='nav') selDraw(lost);
  if(S.toBurger){ S.toBurger = false; if(lost) $('.burger')?.focus(); }
}

// Выполненные задачи проекта (SERBITO-327): hide — не видны; list — на своём месте в списке, приглушённые
// и зачёркнутые; section — открытые, затем сворачиваемый блок «Выполненные (N)», свежие сверху
const DONE_MODES = ['hide', 'list', 'section'];
const doneMode = p => DONE_MODES.includes(p?.done_mode) ? p.done_mode : 'hide';
function projectHtml(pj, items){
  const mode = doneMode(pj), open = items.filter(i => i.status!=='done');
  const done = items.filter(i => i.status==='done').sort((a,b) => (b.completed_at||0) - (a.completed_at||0));
  const shown = mode==='list' ? items : open;
  const dmode = `<select class="dmode" data-act="donemode" data-pid="${pj.id}" aria-label="${t('done_mode.label')}" title="${t('done_mode.label')}">
    ${DONE_MODES.map(m => `<option value="${m}" ${m===mode?'selected':''}>${t('done_mode.'+m)}</option>`).join('')}</select>`;
  const sec = mode==='section' && done.length ? `<details class="donesec" data-done-of="${pj.id}" ${S.doneOpen[pj.id]?'open':''}>
    <summary>${t('done_section', {n:done.length})}</summary>${done.map(itemHtml).join('')}</details>` : '';
  return `<p><a href="${viewPath('projects', null)}" data-act="back">${t('back_projects')}</a></p><h2 class="pjh">#${esc(pj.title)}
      <button class="sm" data-act="renameproj" data-pid="${pj.id}">✏️ ${t('rename')}</button>
      <button class="sm" data-act="delproj" data-pid="${pj.id}">🗑 ${t('delete')}</button>${dmode}</h2>
    ${capHtml(pj)}${dndHtml(shown, 'project') || (sec ? '' : emptyHtml('project', pj.title))}${sec}`;
}
S.doneOpen = {};  // блок «Выполненные» раскрыт — по проектам, до перезагрузки страницы
document.addEventListener('toggle', e => {
  const d = e.target; if(d.dataset?.doneOf) S.doneOpen[d.dataset.doneOf] = d.open;
}, true);  // toggle не всплывает — ловим на погружении

// ── Ручной порядок (SERBITO-328). Карточки в .dnd переставляются: мышью — потянуть по вертикали (по горизонтали —
// это выделение текста), пальцем — удержать ~0,35 с и вести (сразу повёл — это прокрутка), с клавиатуры — Alt+↑↓
// на выбранной карточке. Сервер хранит порядок списка (scope=list) и проекта (project) отдельно; перетаскивание
// не открывает карточку, обычный клик — открывает (SERBITO-299).
const DND_VIEWS = ['inbox', 'next', 'waiting', 'someday'];
const dndHtml = (list, scope = 'list') => list.length ? `<div class="dnd" data-scope="${scope}">${list.map(itemHtml).join('')}</div>` : '';
const DND = {}, DRAG_PX = 6, HOLD_MS = 350, EDGE_PX = 70;
let moveQ = Promise.resolve(), moving = 0;
// Порядок уходит на сервер по одному (иначе быстрые Alt+↓ посчитались бы от устаревших соседей); экран уже
// переставлен — перечитываем данные, когда очередь опустела
function dndSave(el){
  dndTipDone();
  const id = +el.dataset.id, nb = x => x?.dataset.id ? +x.dataset.id : null;
  const body = {prev:nb(el.previousElementSibling), next:nb(el.nextElementSibling), scope:el.parentElement.dataset.scope};
  moving++;
  moveQ = moveQ.then(() => api(`/items/${id}/move`, 'POST', body)).catch(() => {})
    .finally(() => { if(--moving===0) load(); });
}
// Разовая подсказка на сенсорном экране (SERBITO-354): над первым списком, где есть что переставлять, пока человек
// не перетащил задачу или не закрыл подсказку. Мышью — не нужна: тянется сама карточка, курсор это показывает
const dndTip = {
  seen(){ try{ return localStorage.getItem('gtd-dnd-tip') === '1'; }catch{ return true; } },
  draw(){
    if(this.seen() || !matchMedia('(pointer: coarse)').matches) return;
    const box = [...document.querySelectorAll('main .dnd')].find(b => b.children.length > 1);
    box?.insertAdjacentHTML('beforebegin', `<div class="hint dndtip"><span>${t('dnd_tip')}</span>
      <button class="sm" data-act="dndtip">${t('dnd_tip_close')}</button></div>`);
  },
};
function dndTipDone(){ try{ localStorage.setItem('gtd-dnd-tip', '1'); }catch{} $('main .dndtip')?.remove(); }
const dndOrder = box => [...box.children].map(c => c.dataset.id).join();
function dndReset(){
  clearTimeout(DND.timer);
  if(DND.on){
    DND.el.classList.remove('dragging'); DND.el.style.transform = '';
    document.body.classList.remove('dnd-on'); DND.endAt = performance.now();
  }
  for(const k of ['el','box','on','timer']) delete DND[k];
  if(DND.rerender){ DND.rerender = false; render(); }
}
function dndStart(){
  const el = DND.el; if(!el || !el.isConnected) return dndReset();
  Object.assign(DND, {on:true, cy:DND.y, was:dndOrder(DND.box), grab:DND.y - el.getBoundingClientRect().top});
  el.classList.add('dragging'); document.body.classList.add('dnd-on');
  getSelection().removeAllRanges();
  try{ el.setPointerCapture(DND.pid); }catch{}
  if(DND.touch) navigator.vibrate?.(15);
  requestAnimationFrame(dndScroll);
}
// Карточка идёт за указателем; соседи уступают место, когда он пересёк их середину
function dndFollow(){
  const el = DND.el, mid = c => { const r = c.getBoundingClientRect(); return r.top + r.height/2; };
  let c;
  while((c = el.previousElementSibling) && DND.cy < mid(c)) el.parentElement.insertBefore(el, c);
  while((c = el.nextElementSibling) && DND.cy > mid(c)) el.parentElement.insertBefore(el, c.nextElementSibling);
  el.style.transform = '';
  el.style.transform = `translateY(${DND.cy - DND.grab - el.getBoundingClientRect().top}px)`;
  if(!DND.touch) getSelection().removeAllRanges();  // мышь могла начать выделять текст до порога
}
function dndScroll(){  // у края окна список прокручивается сам
  if(!DND.on) return;
  const v = DND.cy < EDGE_PX ? DND.cy - EDGE_PX : DND.cy > innerHeight - EDGE_PX ? DND.cy - innerHeight + EDGE_PX : 0;
  if(v){ scrollBy(0, v / 4); dndFollow(); }
  requestAnimationFrame(dndScroll);
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('main .dnd > .it[data-id]');
  if(!el || e.button !== 0 || DND.el || e.target.closest('a,button,input,select,textarea,label') || $('#dlg').open) return;
  Object.assign(DND, {el, box:el.parentElement, x:e.clientX, y:e.clientY, pid:e.pointerId, touch:e.pointerType==='touch'});
  if(DND.touch && e.target.closest('.grip')) dndStart();  // за ручку — сразу, без удержания (SERBITO-354)
  else if(DND.touch) DND.timer = setTimeout(dndStart, HOLD_MS);
});
document.addEventListener('pointermove', e => {
  if(!DND.el || e.pointerId !== DND.pid) return;
  if(!DND.on){
    const dx = Math.abs(e.clientX - DND.x), dy = Math.abs(e.clientY - DND.y);
    if(DND.touch){ if(Math.hypot(dx, dy) > 10) dndReset(); return; }  // палец поехал раньше — это прокрутка
    if(dx > DRAG_PX && dx >= dy) return dndReset();  // по горизонтали — выделение текста
    if(dy <= DRAG_PX) return;
    dndStart();
  }
  DND.cy = e.clientY; dndFollow(); e.preventDefault();
});
function dndEnd(e){
  if(!DND.el || e.pointerId !== DND.pid) return;
  const {el, box, on, was} = DND;
  dndReset();
  if(!on) return;
  if(e.type==='pointercancel') return render();  // жест отняла система — вернуть как было
  if(dndOrder(box) !== was) dndSave(el);
}
document.addEventListener('pointerup', dndEnd);
document.addEventListener('pointercancel', dndEnd);
// Пока держим карточку, страница под пальцем не прокручивается и не всплывает меню долгого нажатия
document.addEventListener('touchmove', e => { if(DND.on) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if(DND.el && DND.touch) e.preventDefault(); });
// Клик, которым закончилось перетаскивание, карточку не открывает
document.addEventListener('click', e => {
  if(performance.now() - (DND.endAt ?? -1e9) < 300){ e.stopPropagation(); e.preventDefault(); }
}, true);
// Alt+↑↓ — переставить выбранную карточку на одну позицию в её списке
function reorderKey(e){
  if(!e.altKey || e.metaKey || e.ctrlKey || e.shiftKey || !['ArrowUp','ArrowDown'].includes(e.key)) return false;
  if($('#dlg').open || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || S.zone==='nav' || S.sel==null) return false;
  const el = cards()[S.sel], box = el?.parentElement;
  if(!box?.classList.contains('dnd')) return false;
  e.preventDefault();
  const up = e.key==='ArrowUp', sib = up ? el.previousElementSibling : el.nextElementSibling;
  if(!sib) return true;
  box.insertBefore(el, up ? sib : sib.nextElementSibling);
  S.sel += up ? -1 : 1; selDraw(true);
  dndSave(el);
  return true;
}

// ── Google Analytics: только раздел и обезличенные события. gtag() и согласие на cookie сервер кладёт, только если
// задан GA (pages.CONSENT_HEAD), а сам gtag.js — лишь на gtd.serbito.rs: на других хостах события остаются в dataLayer,
// без GA ga()/gaPage() молча ничего не делают.
function ga(name, params = {}){ if(typeof gtag === 'function') gtag('event', name, {...params, language:LANG}); }
function gaPage(){
  if(typeof gtag !== 'function') return;
  const page = S.cfg?.user === false && !$('.app') ? 'login' : (S.view || 'inbox');
  if(S.gaPage === page) return;
  S.gaPage = page;
  const ru = I18N.ru;  // заголовок — всегда русский: отчёты GA не делятся по языку интерфейса, язык — в language
  const label = page==='login' ? ru.login_page : page==='account' ? ru.account_short : page==='stats' ? ru.stats
    : (ru.views[page] || page);
  gtag('event', 'page_view', {page_location: location.origin + '/' + page, page_title: 'GTD — ' + label.replace(/^\S+\s/, ''),
    language: LANG});
}

// ── Undo-тост: после действия с задачей — «Отменить» с обратным отсчётом (5/10/30 с из настроек).
// Новое действие делает предыдущее окончательным. Удаление отложено до конца таймера.
let TOAST = null;
// chips — {label, c}: короткие варианты действия прямо в тосте (контекст после «→ Next»), pick(c) — по нажатию
function toast(text, {undo, commit, chips, pick} = {}){
  toastEnd(true);
  const sec = S.me?.undo_seconds || 30, el = $('#toast');
  el.innerHTML = `<span class="tx">${esc(text)}</span>${chips?.length ? `<span class="cxs" role="group" aria-label="${t('ctx_offer')}">${chips.map(c =>
      `<button class="cx" data-act="ctxset" data-c="${esc(c)}">@${esc(c)}</button>`).join('')}</span>` : ''}${undo?`<button data-act="undo">${t('undo')}</button>`:''}
    <b class="sec">${sec}</b><i class="bar" style="animation-duration:${sec}s"></i>`;
  el.hidden = false;
  let left = sec;
  TOAST = {undo, commit, pick,
    tick: setInterval(() => { left--; const b = el.querySelector('.sec'); if(b) b.textContent = Math.max(left, 0); }, 1000),
    end: setTimeout(() => toastEnd(true), sec * 1000)};
}
function toastEnd(commit){
  if(!TOAST) return null;
  const tt = TOAST; TOAST = null;
  clearInterval(tt.tick); clearTimeout(tt.end); $('#toast').hidden = true;
  if(commit) tt.commit?.();
  return tt;
}
async function toastUndo(){ const tt = toastEnd(false); if(tt?.undo) await tt.undo(); load(); }
addEventListener('pagehide', () => toastEnd(true));  // закрыли вкладку — отложенное удаление всё равно выполнится
const findItem = id => S.items.concat(S.dueItems||[], S.nextItems||[]).find(i => i.id===id);
// Из Inbox в Next без контекста — тост предлагает до трёх знакомых @контекстов (SERBITO-354, G9): контекст не
// обязателен и не добавляет шага, но с ним работает фильтр Next
async function moveItem(id, status){
  const it = findItem(id); if(!it) return;
  const prev = it.status;
  await api('/items/'+id, 'PATCH', {status});
  load();
  const chips = status==='next' && prev==='inbox' && !it.context ? S.contexts.slice(0, 3) : [];
  toast(t('moved', {title:it.title, to:L.moved_to[status]||status}), {undo: () => api('/items/'+id, 'PATCH', {status:prev}), chips,
    pick: async c => { await api('/items/'+id, 'PATCH', {context:c}); load();
      toast(t('moved', {title:it.title, to:`${L.moved_to.next} @${c}`}), {undo: () => api('/items/'+id, 'PATCH', {context:null})}); }});
}
S.pendingDel = new Set();  // удалённые, но ещё не отправленные на сервер (ждут конца таймера)
function deleteItem(id){

// ── Черновики: введённый, но не сохранённый текст живёт в localStorage этого браузера —
// переживает перезагрузку, случайный Esc и закрытие вкладки. Стирается при сохранении или «Отмене».
const draft = {
  get(k){ try{ return JSON.parse(localStorage.getItem('gtd-draft:'+k)); }catch{ return null; } },
  set(k, v){ try{ localStorage.setItem('gtd-draft:'+k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem('gtd-draft:'+k); }catch{} },
  // Выход: черновики задач не должны достаться следующему человеку за этим компьютером (SERBITO-360, GTD-14)
  clear(){ try{ Object.keys(localStorage).filter(k => k.startsWith('gtd-draft:')).forEach(k => localStorage.removeItem(k)); }catch{} },
};
const ITEM_FIELDS = ['title','notes','status','project_id','newproj','context','remind'];

// Диалог (карточка задачи, проект): закрыли — фокус туда, откуда открыли (SERBITO-349), а не на <body>. Открывший
// элемент мог пропасть — список перерисовался после сохранения: тогда такой же по селектору back. Возвращает
// функцию возврата: её зовут и после перерисовки (сохранение → load)
function dlgShow(back){
  const d = $('#dlg'), opener = document.activeElement;
  const ret = () => {
    const a = document.activeElement; if(a && a !== document.body && a.isConnected) return;  // фокус уже на месте
    (opener?.isConnected && opener !== document.body ? opener : back && document.querySelector(back))?.focus();
  };
  d.addEventListener('close', ret, {once:true});
  d.showModal();
  return ret;
}

// У каждой задачи своя ссылка /i/<номер>: открытая карточка отражается в адресе, закрыли — вернулись на /
const itemLink = it => `${location.origin}/i/${it.num}`;
function openEdit(id, found){
  const it = found || findItem(id); if(!it) return;
  const d = $('#dlg');
  // Своя запись в истории: Back закрывает карточку. Пришли прямой ссылкой (или Forward) — адрес уже этот
  if(location.pathname !== `/i/${it.num}`) history.pushState({card:it.num}, '', `/i/${it.num}`);
  d.onclose = () => {  // закрыли (Esc, «Отмена», сохранение) — вернуться к разделу: назад по своей записи или заменой
    acClose();
    if(!location.pathname.startsWith('/i/')) return;  // закрыта по Back — адрес уже раздела
    if(history.state?.card) history.back(); else history.replaceState(null, '', viewPath());
  };
  d.innerHTML = `<form method="dialog" id="ef"><h3 style="margin:0 0 6px"><span id="dlg-h">${t('task_n', {n:it.num})}</span>
      <button type="button" class="sm" data-act="copylink" aria-label="${t('copy_link')}" title="${t('copy_link_to', {url:esc(itemLink(it))})}">🔗</button></h3>
    <label for="ef-title">${t('f_title')}</label><div class="capw"><input id="ef-title" name="title" value="${esc(it.title)}" required autofocus autocomplete="off" data-ac-src>
      <div class="ac" role="listbox" hidden></div></div>
    <label for="ef-notes">${t('f_notes')}</label><textarea id="ef-notes" name="notes" rows="3">${esc(it.notes)}</textarea>
    <label for="ef-status">${t('f_list')}</label><select id="ef-status" name="status">${['inbox','next','waiting','someday','reference','done','trash'].map(s=>`<option value="${s}" ${s===it.status?'selected':''}>${L.status[s]}</option>`).join('')}</select>
    <label for="ef-project">${t('f_project')}</label><select id="ef-project" name="project_id"><option value="">—</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===it.project_id?'selected':''}>${esc(p.title)}</option>`).join('')}
      <option value="new">${t('new_project_opt')}</option></select>
    <div class="newproj" hidden><label for="ef-newproj">${t('new_project_name')}</label><input id="ef-newproj" name="newproj" autocomplete="off"></div>
    <label for="ef-context">${t('f_context')}</label><input id="ef-context" name="context" value="${esc(it.context||'')}" placeholder="${t('f_context_ph')}">
    <label for="ef-remind">${t('f_remind')}</label><input id="ef-remind" type="datetime-local" name="remind" value="${toLocalInput(it.remind_at)}">
    <div class="draftnote" hidden>${t('draft')} · <a href="#" data-act="dropdraft">${t('draft_drop')}</a></div>
    <div class="row"><button type="button" data-act="del" style="color:#d33">${t('delete')}</button><span><button type="button" data-act="cancel">${t('cancel')}</button> <button class="pri" value="ok">${t('save')}</button></span></div></form>`;
  const form = $('#ef'), key = 'item:'+it.id, saved = draft.get(key);
  if(saved){
    ITEM_FIELDS.forEach(k => { if(k in saved && form.elements[k]) form.elements[k].value = saved[k]; });
    form.querySelector('.draftnote').hidden = false;
  }
  const keep = () => draft.set(key, Object.fromEntries(ITEM_FIELDS.map(k => [k, form.elements[k].value])));
  form.addEventListener('input', keep); form.addEventListener('change', keep);
  // «+ Новый проект…» в списке проектов (SERBITO-354) — под ним поле названия, обязательное, пока оно выбрано
  const np = form.querySelector('.newproj'), npSync = focus => {
    const on = form.elements.project_id.value === 'new';
    np.hidden = !on; form.elements.newproj.required = on;
    if(on && focus) form.elements.newproj.focus();
  };
  npSync(false);
  form.elements.project_id.addEventListener('change', () => npSync(true));
  form.querySelector('[data-act=dropdraft]').onclick = e => { e.preventDefault(); draft.del(key); openEdit(id, it); };
  const back = dlgShow(`main .it[data-id="${id}"]`);
  $('#ef').onsubmit = async e => {
    draft.del(key);
    const f = new FormData(e.target);
    let pid = f.get('project_id');
    if(pid === 'new') pid = (await api('/projects','POST',{title:f.get('newproj').trim()})).id;
    await api('/items/'+id,'PATCH',{title:f.get('title'),notes:f.get('notes'),status:f.get('status'),
      project_id:pid?+pid:null, context:f.get('context'),
      remind_at:f.get('remind')?Math.floor(new Date(f.get('remind')).getTime()/1000):null});
    await load(); back();
  };
  d.querySelector('[data-act=cancel]').onclick = () => { draft.del(key); d.close(); };  // «Отмена» — осознанно выбросить
  d.querySelector('[data-act=copylink]').onclick = async e => {
    const b = e.currentTarget;
    try{ await navigator.clipboard.writeText(itemLink(it)); b.textContent = '✓'; setTimeout(() => b.textContent = '🔗', 1200); }
    catch{ prompt(t('task_link'), itemLink(it)); }
  };
  // Без confirm: удаление отменяется из тоста «Отменить»
  d.querySelector('[data-act=del]').onclick = () => { draft.del(key); d.close(); deleteItem(id); };
}

  const n = p.total_count, d = $('#dlg');
  d.innerHTML = `<h3 id="dlg-h" style="margin:0 0 6px">${t('delete_project_q', {title:esc(p.title)})}</h3>
    <p class="hint" style="margin:0">${n ? t('project_tasks', {n}) : t('project_no_tasks')}</p>
    <div class="msg" id="pdmsg"></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      ${n ? `<button data-del="keep">${t('del_keep')}</button>
      <button data-del="delete" style="color:#d33">${t('del_all', {n})}</button>`
          : `<button data-del="keep" style="color:#d33">${t('del_project')}</button>`}
      <button data-del="">${t('cancel')}</button></div>`;
  dlgShow(`[data-act=delproj][data-pid="${pid}"]`);
  d.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!b.dataset.del) return d.close();
    try{ await projApi(pid, 'DELETE', null, '?items='+b.dataset.del); d.close();
      if(S.pid===pid){ S.pid = null; history.replaceState(null, '', viewPath()); } load(); }
    catch(err){ $('#pdmsg').textContent = err.message; }
  });
}

// Куда ушла задача, видно не всегда: на странице проекта она в нём, в Waiting или Done — в Inbox. Кроме Inbox
// (там она в списке или в Next ниже) — тост «… → куда» с «Отменить» (SERBITO-354)
async function newProject(){
  const inp = $('#np'), v = inp.value.trim();
  if(!v){ $('#npmsg').textContent = t('project_name_needed'); return inp.focus(); }
  const had = S.projects.find(p => p.title.toLowerCase() === v.toLowerCase());  // сервер вернёт тот же проект
  await api('/projects','POST',{title:v});
  await load();
  toast(t(had ? 'project_exists' : 'project_created', {p:had ? had.title : v}));
  $('#np')?.focus();
}

async function capture(){
  const inp = $('#cap'); const v = inp.value.trim(); if(!v) return;
  const pid = inp.dataset.pid ? +inp.dataset.pid : undefined;
  inp.value=''; acClose(); draft.del('cap');
  const it = await api('/capture','POST',{text:v, project_id:pid});
  ga('task_capture', {channel:'web'});  // только факт — текст задачи в GA не уходит
  await load(); $('#cap')?.focus();  // записываем подряд, не кликая в поле снова
  if(it?.id && S.view!=='inbox')
    toast(t('moved', {title:it.title, to:it.project ? '#'+it.project : L.moved_to[it.status]||it.status}),
      {undo: () => api('/items/'+it.id, 'DELETE')});
}

// ── Подсказки в поле захвата и в заголовке карточки (SERBITO-298): «@» — существующие контексты,
// «#» — активные проекты. Сервер разбирает #проект как [\w-]+ с «_» вместо пробелов, поэтому вставляем так же.
// Список — .ac рядом с полем внутри .capw; AC.inp — поле, для которого он сейчас открыт.
const AC = {items:[], i:0, start:0, end:0, inp:null};
function acUpdate(inp){
  AC.inp = inp;
  const pos = inp.selectionStart, m = inp.value.slice(0, pos).match(/(?:^|\s)([@#])([\p{L}\p{N}_-]*)$/u);
  if(!m) return acClose();
  const [, sig, q] = m, ql = q.toLowerCase();
  const pool = sig==='@'
    ? S.contexts.map(c => ({label:'@'+c, ins:'@'+c}))
    : S.projects.filter(p => /^[\p{L}\p{N}_\s-]+$/u.test(p.title))
        .map(p => ({label:'#'+p.title, ins:'#'+p.title.trim().replace(/\s+/g,'_')}));
  const key = o => o.ins.slice(1).toLowerCase();
  AC.items = pool.filter(o => key(o).includes(ql) && key(o)!==ql)
    .sort((a,b) => key(b).startsWith(ql) - key(a).startsWith(ql)).slice(0, 8);
  AC.start = pos - q.length - 1; AC.end = pos; AC.i = 0;
  acDraw();
}
function acDraw(){
  const box = AC.inp?.closest('.capw')?.querySelector('.ac'); if(!box) return;
  box.hidden = !AC.items.length;
  box.innerHTML = AC.items.map((o,k) => `<div class="aco ${k===AC.i?'on':''}" role="option" data-ac="${k}">${esc(o.label)}</div>`).join('');
}
function acClose(){ AC.items = []; acDraw(); }
function acPick(k){
  const inp = AC.inp, o = AC.items[k]; if(!inp || !o) return;
  const rest = inp.value.slice(AC.end), ins = o.ins + (rest.startsWith(' ') ? '' : ' ');
  inp.value = inp.value.slice(0, AC.start) + ins + rest;
  const p = AC.start + ins.length; inp.setSelectionRange(p, p); inp.focus(); acClose();
  inp.dispatchEvent(new Event('input', {bubbles:true}));  // черновик и высота поля — как при наборе
}

// Клик по любому месту карточки задачи открывает её, как по заголовку (SERBITO-299). Кнопки, ссылки,
// галочка и ряд кнопок списков (промах мимо кнопки на телефоне) — не открывают; конец выделения текста — тоже.
const selecting = c => { const s = getSelection(); return !s.isCollapsed && c.contains(s.anchorNode); };
function cardClick(e){
  const c = e.target.closest('main .it[data-id]');
  if(!c || e.target.closest('a,button,input,select,textarea,label,.act') || selecting(c)) return;
  openEdit(+c.dataset.id);
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-view],[data-ctx],[data-pid]'); if(!el) return cardClick(e);
  if(el.tagName==='A' && el.dataset.view && (e.metaKey || e.ctrlKey || e.shiftKey)) return;  // раздел в новой вкладке
  if(el.tagName==='A' && (el.dataset.view || el.getAttribute('href')?.startsWith('#'))) e.preventDefault();  // переход — сами
  const act = el.dataset.act, itemEl = el.closest('.it[data-id]'), id = itemEl && +itemEl.dataset.id;
  if(act==='drawer') return drawer(!$('nav').classList.contains('open'));
  if(act==='umenu'){ const m = el.parentElement.querySelector('.umenu'); m.hidden = !m.hidden; el.setAttribute('aria-expanded', !m.hidden); return; }
  if(act==='capture') return capture();
  if(act==='emailsend') return emailSend();
  if(act==='emailverify') return emailVerify();
  if(act==='tglogin') return tgStart();
  if(act==='merge') return mergeApply(el.dataset.token);
  if(act==='nomerge') return authMsg('');
  if(act==='edit'){  // номер — ссылка /i/N: ⌘/Ctrl/Shift-клик открывает её в новой вкладке/окне, как обычная ссылка
    if(el.tagName==='A' && (e.metaKey || e.ctrlKey || e.shiftKey)) return;
    if(itemEl && selecting(itemEl)) return;
    e.preventDefault(); return openEdit(id);
  }
  if(act==='mv') return moveItem(id, el.dataset.st);
  if(act==='toproj') return openToProject(id);
  if(act==='dndtip') return dndTipDone();
  if(act==='undo') return toastUndo();
  if(act==='ctxset') return TOAST?.pick?.(el.dataset.c);
  if(act==='onbclose'){ S.counts.onboarding.hidden = true; render(); return api('/me','PATCH',{checklist_hidden:true}); }
  if(act==='undosec'){ S.me = await api('/me','PATCH',{undo_seconds:+el.dataset.n}); return render(); }
  if(act==='logout'){ draft.clear(); await api('/logout','POST'); S.me = null; return location.assign(LANG==='en' ? '/en/' : '/'); }  // на лендинг: его текст — с сервера
  if(act==='logoutall'){
    if(!confirm(t('logout_all_q'))) return;
    draft.clear(); await api('/logout/all','POST'); S.me = null; return location.assign(LANG==='en' ? '/en/' : '/');
  }
  if(act==='lang'){  // явный выбор (или «Авто») — сильнее входа на /en/: подсказку и адрес /en/ забываем
    S.me = await api('/me','PATCH',{lang:el.dataset.l || null}); langHint.del();
    if(S.en){ S.en = false; history.replaceState(null, '', viewPath()); }
    setLang(S.me.lang || autoLang()); return render();
  }
  if(act==='newproj') return newProject();
  if(act==='newtok') return createToken();
  if(act==='copytok') return copyToken(el);
  if(act==='tokhide'){ S.newToken = null; return render(); }
  if(act==='revoketok') return revokeToken(+el.dataset.id);
  if(act==='disconnectapp') return disconnectApp(+el.dataset.id);
  if(act==='renameproj'){ e.stopPropagation(); return openRenameProject(+el.dataset.pid); }
  if(act==='delproj'){ e.stopPropagation(); return openDeleteProject(+el.dataset.pid); }
  if(act==='closeproj'){ e.stopPropagation(); await api('/projects/'+el.dataset.pid,'PATCH',{status:'done'}); return load(); }
  if(act==='back') return go('projects');
  if(el.dataset.ctx!==undefined && !act && !el.dataset.view){ S.ctx=el.dataset.ctx||null; return render(); }
  if(el.dataset.view){
    S.toBurger = !!el.closest('nav.open');  // выбрали в выезжающем меню — оно закроется, фокус вернётся на ☰
    S.zone='main'; return go(el.dataset.view, el.dataset.pid ? +el.dataset.pid : null);
  }
  if(el.dataset.pid && el.classList.contains('pj')) return go('projects', +el.dataset.pid);
});
document.addEventListener('change', async e => {
  if(e.target.dataset.act==='donemode'){  // режим показа выполненных — запоминается в проекте на сервере
    const pid = +e.target.dataset.pid, p = await projApi(pid, 'PATCH', {done_mode:e.target.value});
    S.projects = S.projects.map(x => x.id===pid ? {...x, done_mode:p.done_mode} : x);
    return load();
  }
  if(e.target.dataset.act==='toggle'){
    const id = +e.target.closest('.it').dataset.id;
    await moveItem(id, e.target.checked ? 'done' : 'next');
  }
});
// Высота поля захвата по содержимому; переносы строк (вставка) → пробелы: задача — одна строка
function capFit(el = $('#cap')){
  if(!el) return;
  if(/[\r\n]/.test(el.value)){ const p = el.selectionStart; el.value = el.value.replace(/[\r\n]+/g, ' '); el.setSelectionRange(p, p); }
  if(!el.value){ el.style.height = ''; return; }  // пустое — одна строка (иначе браузер меряет перенос подсказки)
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 2 + 'px';  // +2 — рамка (box-sizing: border-box)
}
addEventListener('resize', () => { capFit(); capHint(); });
document.addEventListener('input', e => {
  if(e.target.dataset.acSrc!==undefined) return acUpdate(e.target);
  if(e.target.id!=='cap') return;
  capFit(e.target);
  acUpdate(e.target);
  e.target.value ? draft.set('cap', e.target.value) : draft.del('cap');  // недописанная задача не потеряется
});
// Ушли в поле или кликнули мышью мимо меню — выходим из режима меню
const leaveMenu = () => { if(S.zone==='nav'){ S.zone = 'main'; selDraw(); } };
// Пункт меню получил фокус с клавиатуры (Tab) — режим меню с этого пункта: стрелки идут от него (SERBITO-349)
document.addEventListener('focusin', e => {
  const a = e.target.closest?.('nav > a[data-view]');
  if(!a) return leaveMenu();
  if(a.matches(':focus-visible') && !(S.zone==='nav' && menu()[S.navSel]===a)){ S.zone = 'nav'; S.navSel = menu().indexOf(a); selDraw(); }
});
document.addEventListener('mousedown', e => {
  if(!e.target.closest('nav')) leaveMenu();
  if(!e.target.closest('.userbox')) closeUmenu();
});
function closeUmenu(){
  document.querySelectorAll('.umenu').forEach(m => { m.hidden = true; m.parentElement.querySelector('[aria-expanded]')?.setAttribute('aria-expanded', false); });
}
// Выезжающее меню на телефоне (SERBITO-349): открылось — фокус на текущий раздел внутри него, Tab ходит по кругу
// внутри (drawerTab), Esc / ☰ / тап мимо закрывают и возвращают фокус на ☰
function drawer(open){
  const nav = $('nav'), burger = $('.burger'); if(!nav) return;
  nav.classList.toggle('open', open); $('.scrim')?.classList.toggle('open', open);
  burger?.setAttribute('aria-expanded', open);
  if(open) (nav.querySelector('a[aria-current]') || nav.querySelector('a[href]'))?.focus();
  else if(nav.contains(document.activeElement)) burger?.focus();
}
const closeDrawer = () => drawer(false);
function drawerTab(e){
  if(e.key!=='Tab' || !$('nav.open')) return false;
  const f = [...$('nav').querySelectorAll('a[href],button')].filter(x => x.getClientRects().length);
  const i = f.indexOf(document.activeElement);
  if(e.shiftKey ? i <= 0 : i < 0 || i === f.length-1){ e.preventDefault(); (e.shiftKey ? f.at(-1) : f[0])?.focus(); }
  return true;
}
// mousedown, а не click: клик по подсказке не должен уводить фокус из поля
document.addEventListener('mousedown', e => {
  const o = e.target.closest('[data-ac]');
  if(o){ e.preventDefault(); acPick(+o.dataset.ac); }
  else if(!e.target.closest('.capw')) acClose();
});
// ── Навигация с клавиатуры. Список: ↑↓ — карточки, Enter — открыть, ← — в меню, Esc — снять выбор.
// Меню: ↑↓ — пункты, Enter — открыть раздел, → / Esc — обратно к списку.
// Пока печатаешь в поле, открыта карточка или подсказки @/# — стрелки не трогаем.
const cards = () => [...document.querySelectorAll('main .it')].filter(c => c.getClientRects().length);  // без свёрнутых
const menu = () => [...document.querySelectorAll('nav > a[data-view]')];  // без «Выйти»: случайный Enter не разлогинит
// focus — фокус браузера идёт за выбором (SERBITO-349): так его видят экранные чтецы, а Tab продолжает с него
function selDraw(focus){
  const list = cards();
  list.forEach((c, i) => c.classList.toggle('sel', S.zone!=='nav' && i===S.sel));
  if(S.zone!=='nav') list[S.sel]?.scrollIntoView({block:'nearest'});
  menu().forEach((a, i) => a.classList.toggle('kb', S.zone==='nav' && i===S.navSel));
  const el = S.zone==='nav' ? menu()[S.navSel] : S.sel!=null ? list[S.sel] : null;
  if(focus && el && document.activeElement!==el) el.focus({preventScroll:true});
}
function toMenu(){
  S.zone = 'nav';
  const i = menu().findIndex(a => a.dataset.view===S.view && !a.dataset.pid);
  S.navSel = i < 0 ? 0 : i;
}
// C (create) / N (new) — к полю захвата, если сейчас не печатаешь в поле. По e.code — физической
// клавише, поэтому работает и на русской раскладке (С / Т). ⌘/Ctrl-сочетания (⌘C) не трогаем.
function captureKey(e){
  if(e.code!=='KeyC' && e.code!=='KeyN') return false;
  if(e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || $('#dlg').open) return false;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return false;
  const cap = $('#cap') || $('#np'); if(!cap) return false;  // на экране проектов — поле нового проекта
  e.preventDefault();  // иначе буква впечатается в поле
  closeDrawer(); S.zone = 'main'; S.sel = null; selDraw();
  cap.focus(); cap.setSelectionRange(cap.value.length, cap.value.length);
  return true;
}

function navKey(e){
  if($('#dlg').open || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return false;
  const list = cards();
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    if(e.target.id!=='cap' || AC.items.length) return false;
    const atEnd = e.target.selectionStart === e.target.value.length;  // иначе ↓ ходит по строкам поля
    if(e.key==='ArrowDown' && list.length && atEnd){ e.preventDefault(); e.target.blur(); S.zone = 'main'; S.sel = 0; selDraw(true); return true; }
    if(e.key==='ArrowLeft' && !e.target.value){ e.preventDefault(); e.target.blur(); toMenu(); selDraw(true); return true; }
    return false;
  }
  if(S.zone==='nav'){
    const items = menu();
    if(e.key==='ArrowDown') S.navSel = Math.min(S.navSel+1, items.length-1);
    else if(e.key==='ArrowUp') S.navSel = Math.max(S.navSel-1, 0);
    else if(e.key==='Enter' && items[S.navSel]){
      const i = S.navSel, inDrawer = !!$('nav.open'); e.preventDefault(); S.sel = null;
      items[i].click();
      if(!inDrawer){ S.zone = 'nav'; S.navSel = i; }  // открыть раздел, остаться в меню (выезжающее — закрылось)
      selDraw(); return true;
    }
    else if(e.key==='ArrowRight'){  // в основное окно — на первую карточку, а если их нет — в поле захвата
      S.zone = 'main';
      if(cards().length) S.sel = 0; else { S.sel = null; $('#cap')?.focus(); }
    }
    else if(e.key==='Escape'){ S.zone = 'main'; if(S.sel==null) document.activeElement?.blur(); }  // Esc — к прежнему выбору
    else return false;
    e.preventDefault(); selDraw(true); return true;
  }
  // Фокус на карточке (вернулись из диалога, кликнули) — выбор стрелками идёт от неё. Enter на ссылке или кнопке —
  // её собственное действие, а не «открыть выбранную карточку»
  const card = e.target.closest?.('main .it');
  if(card===e.target && S.sel==null && ['ArrowDown','ArrowUp','Enter'].includes(e.key)) S.sel = list.indexOf(card);
  if(e.key==='Enter' && card!==e.target && e.target.matches?.('a[href],button,summary')) return false;
  if(e.key==='ArrowDown' && list.length) S.sel = S.sel==null ? 0 : Math.min(S.sel+1, list.length-1);
  else if(e.key==='ArrowUp' && S.sel!=null){
    if(S.sel===0){ S.sel = null; $('#cap')?.focus(); } else S.sel--;
  }
  else if(e.key==='Enter' && S.sel!=null && list[S.sel]){
    const c = list[S.sel]; e.preventDefault();
    return c.dataset.id ? (openEdit(+c.dataset.id), true) : (c.click(), true);  // задача или проект
  }
  else if(e.key==='ArrowLeft') toMenu();
  else if(e.key==='Escape' && S.sel!=null){ S.sel = null; if(e.target.closest?.('main .it')) e.target.blur(); }
  else return false;
  e.preventDefault(); selDraw(true); return true;
}

document.addEventListener('keydown', e => {
  if(e.target===AC.inp && AC.items.length){
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault(); AC.i = (AC.i + (e.key==='ArrowDown' ? 1 : -1) + AC.items.length) % AC.items.length; return acDraw();
    }
    // preventDefault: Enter не отправит карточку, Esc закроет только подсказки, а не карточку
    if(e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); return acPick(AC.i); }
    if(e.key==='Escape'){ e.preventDefault(); return acClose(); }
  }
  if(e.key==='Escape' && $('nav.open')) return closeDrawer();
  if(drawerTab(e)) return;
  const um = e.key==='Escape' && [...document.querySelectorAll('.umenu')].find(m => !m.hidden);
  if(um){ closeUmenu(); return um.parentElement.querySelector('button.user')?.focus(); }
  if(captureKey(e)) return;
  if(reorderKey(e)) return;
  if(navKey(e)) return;
  if(e.key!=='Enter') return;
  if(e.target.id==='cap'){ e.preventDefault(); capture(); }  // Enter — добавить, а не перенос строки
  if(e.target.id==='np') document.querySelector('[data-act=newproj]').click();
  if(e.target.id==='tokname') createToken();
  if(e.target.id==='em') emailSend();
  if(e.target.id==='code') emailVerify();
});
load();
</script>
</body>
