[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # Ноль предупреждений (SERBITO-613): любое предупреждение — падение теста. Исключения — только точечные,
    # с причиной в комментарии, и только для чужого кода без исправления
    error
    # TestClient Starlette 1.x — на httpx2 (requirements-dev.txt); старый httpx у него устарел — это ошибка
    error:Using `httpx` with `starlette.testclient` is deprecated
